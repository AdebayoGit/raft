name: RaftDbBindings
description: Raw FFI bindings for raft-db C API.
output: 'lib/src/raft_db_bindings.dart'

headers:
  entry-points:
    - '../core/include/raft.h'

compiler-opts:
  - '-w'

# Only emit the raft-specific symbols; exclude all system header noise.
functions:
  include:
    # Raw KV
    - 'rft_open'
    - 'rft_close'
    - 'rft_put'
    - 'rft_get'
    - 'rft_delete'
    # Typed collections
    - 'rft_collection_put'
    # Batch / scan / prepared-handle hot paths (binary codec)
    - 'rft_collection_put_many'
    - 'rft_collection_delete_many'
    - 'rft_collection_scan'
    - 'rft_collection_get_buf'
    - 'rft_collection_open'
    - 'rft_collection_close'
    - 'rft_coll_get_buf'
    - 'rft_coll_get_many'
    - 'rft_coll_generation'
    - 'rft_buf_data'
    - 'rft_buf_len'
    - 'rft_buf_free'
    - 'rft_collection_put_auto'
    - 'rft_collection_get'
    - 'rft_collection_delete'
    - 'rft_collection_count'
    - 'rft_collection_list_ids'
    # Queries
    - 'rft_query_execute'
    - 'rft_query_result_count'
    - 'rft_query_result_get'
    - 'rft_query_result_free'
    # Transactions
    - 'rft_transaction_begin'
    - 'rft_transaction_get'
    - 'rft_transaction_put'
    - 'rft_transaction_delete'
    - 'rft_transaction_commit'
    - 'rft_transaction_rollback'
    # Observation
    - 'rft_observe'
    - 'rft_observe_query'
    - 'rft_unobserve'
    # Dart-port observation (Dart_PostCObject_DL delivery)
    - 'rft_dart_init'
    - 'rft_observe_dart_port'
    - 'rft_observe_query_dart_port'

structs:
  include:
    - 'RaftDb'
    - 'RaftQueryResult'
    - 'RaftTransaction'
    - 'RaftCollection'
    - 'RftBuf'

enums:
  include:
    - 'RftError'

globals:
  exclude:
    - '.*'

unnamed-enums:
  exclude:
    - '.*'

# We need RftObserveCallback for rft_observe / rft_observe_query.
typedefs:
  include:
    - 'RftObserveCallback'

silence-enum-warning: true

preamble: |
  // AUTO-GENERATED — do not edit.
  // Generated by dart run ffigen from raft.h.
  // ignore_for_file: unused_element, unused_field, camel_case_types
