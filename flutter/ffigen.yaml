name: RaftDbBindings
description: Raw FFI bindings for raft-db C API.
output: 'lib/src/raft_db_bindings.dart'

headers:
  entry-points:
    - '../core/include/raft.h'

compiler-opts:
  - '-w'
  # The C header uses a bare `rft_` function-attribute prefix that
  # cbindgen emits without a macro definition. Define it to nothing
  # here so libclang can parse the header.
  - '-Drft_='

# Only emit the raft-specific symbols; exclude all system header noise.
functions:
  include:
    # Raw KV
    - 'rft_open'
    - 'rft_close'
    - 'rft_put'
    - 'rft_get'
    - 'rft_delete'
    # Typed collections
    - 'rft_collection_put'
    - 'rft_collection_put_auto'
    - 'rft_collection_get'
    - 'rft_collection_delete'
    - 'rft_collection_count'
    - 'rft_collection_list_ids'
    # Queries
    - 'rft_query_execute'
    - 'rft_query_result_count'
    - 'rft_query_result_get'
    - 'rft_query_result_free'
    # Transactions
    - 'rft_transaction_begin'
    - 'rft_transaction_get'
    - 'rft_transaction_put'
    - 'rft_transaction_delete'
    - 'rft_transaction_commit'
    - 'rft_transaction_rollback'
    # Observation
    - 'rft_observe'
    - 'rft_observe_query'
    - 'rft_unobserve'

structs:
  include:
    - 'RaftDb'
    - 'RaftQueryResult'
    - 'RaftTransaction'

enums:
  include:
    - 'RftError'

globals:
  exclude:
    - '.*'

unnamed-enums:
  exclude:
    - '.*'

# We need RftObserveCallback for rft_observe / rft_observe_query.
typedefs:
  include:
    - 'RftObserveCallback'

silence-enum-warning: true

preamble: |
  // AUTO-GENERATED — do not edit.
  // Generated by dart run ffigen from raft.h.
  // ignore_for_file: unused_element, unused_field, camel_case_types
