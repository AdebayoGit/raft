[package]
name = "raft-db"
version = "0.0.1"
edition = "2021"
# MSRV — highest requirement in the dependency graph (getrandom 0.4).
rust-version = "1.85"
description = "Mobile-native embedded database. Offline-first by design."
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/raft-db"
keywords = ["database", "embedded", "mobile", "offline-first", "crdt"]
categories = ["database-implementations", "embedded"]

[lib]
name = "raftdb"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# AES-256-GCM for encryption at rest (F4). RustCrypto's audited AEAD — we
# never roll our own crypto. no-default-features keeps the dependency
# surface minimal (no rand_core/getrandom pull-in; nonces come from our
# existing getrandom dependency).
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
bytes = "1"
crc32fast = "1"
getrandom = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
thiserror = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"], optional = true }
# Structured, redacted diagnostics (X5). Events are no-ops unless the host
# installs a subscriber, so the mobile binary cost is negligible.
tracing = { version = "0.1", default-features = false, features = ["std"] }

[features]
default = []
async = ["tokio"]
ffi = ["async", "serde_json"]   # enables C ABI layer (requires async runtime + JSON for FFI doc format)
sync = ["async"]                # enables sync engine

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
tracing-subscriber = "0.3"

[[bench]]
name = "storage"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# NOTE: `panic = "abort"` is intentionally NOT set. The FFI layer relies on
# `catch_unwind` to convert internal panics into error codes instead of
# killing the host app; abort-on-panic would defeat that safety net.
strip = true
