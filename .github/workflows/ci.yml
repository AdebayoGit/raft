# Raft CI — core gates + four-binding build matrix (F6b, X4).
#
# Every job must be green to merge; enable branch protection on `main`
# with all jobs listed as required status checks.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- core
  core:
    name: core (fmt, clippy, tests, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: cargo fmt
        working-directory: core
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: core
        run: cargo clippy --features ffi --tests -- -D warnings

      # Includes the crash-recovery harness (tests/crash_recovery.rs) and
      # CRDT/HLC property tests alongside the unit suite.
      - name: cargo test
        working-directory: core
        run: cargo test --features ffi

      - name: install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: core
        run: cargo audit

  # ------------------------------------------------------- leak sanitizer
  # ASan + LSan over the FFI test suite (F7d). All four bindings drive
  # this same C ABI, so an LSAN-clean run covers their native side.
  leak-sanitizer:
    name: leak sanitizer (ASan + LSan, ffi tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: asan

      - name: cargo test under AddressSanitizer
        working-directory: core
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1
        run: |
          cargo +nightly test --features ffi --lib \
            -Zbuild-std --target x86_64-unknown-linux-gnu

  # ---------------------------------------------------------- fuzz smoke
  fuzz-smoke:
    name: fuzz smoke (15s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      # cargo-fuzz defaults to the musl target on Linux since 0.12.x, but
      # the nightly toolchain image ships std only for the gnu triple —
      # builds die with "can't find crate for `core`". Pin the gnu target.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fuzz

      - name: install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: run fuzz targets
        working-directory: core
        run: |
          for target in wal_entry_decode manifest_record_decode sstable_reader_open ffi_json_envelopes; do
            # Always replay committed regression seeds (deterministic — past
            # fuzz finds must never silently return), then explore for 15s.
            seeds="fuzz/seeds/$target"
            [ -d "$seeds" ] || seeds=""
            cargo +nightly fuzz run "$target" $seeds --target x86_64-unknown-linux-gnu -- -max_total_time=15
          done

  # -------------------------------------------------------------- flutter
  flutter:
    name: binding / flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        working-directory: flutter
        run: flutter pub get

      - name: dart format
        working-directory: flutter
        run: dart format --output=none --set-exit-if-changed lib test

      - name: dart analyze
        working-directory: flutter
        run: dart analyze --fatal-infos

      - name: flutter test
        working-directory: flutter
        run: flutter test

  # ---------------------------------------------------------- kotlin/jni
  android:
    name: binding / kotlin-jni
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Rebuild libraftdb.so from the current core so the AAR links
      # against the code under test, not the committed prebuilt.
      - name: build core for android ABIs
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../android/src/main/jniLibs \
            build --release --features ffi

      - name: gradle build + unit tests
        run: gradle -p android assembleDebug testDebugUnitTest

  # ---------------------------------------------------------------- swift
  swift:
    name: binding / swift
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # The committed xcframework only carries iOS slices. Build the core
      # for the macOS host and repackage so `swift test` can link and run.
      - name: build core for macOS host
        working-directory: core
        run: cargo build --release --features ffi

      - name: repackage xcframework with macOS slice
        run: |
          rm -rf swift/RaftDB.xcframework
          xcodebuild -create-xcframework \
            -library core/target/release/libraftdb.a \
            -output swift/RaftDB.xcframework

      - name: swift build
        working-directory: swift
        run: swift build

      - name: swift test
        working-directory: swift
        run: swift test

  # ------------------------------------------------------------- rn nitro
  rn:
    name: binding / rn-nitro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: bun install
        working-directory: rn
        run: bun install --frozen-lockfile

      - name: typecheck
        working-directory: rn
        run: bun run typecheck

      - name: jest
        working-directory: rn
        run: bun run test

  rn-android-native:
    name: binding / rn android native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: oven-sh/setup-bun@v2
      - name: install JavaScript dependencies
        working-directory: rn
        run: bun install --frozen-lockfile
      - name: rebuild Rust Android library
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t x86_64 -o ../rn/android/src/main/jniLibs build --release --features ffi
      - name: verify exported C ABI
        run: $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm -D --defined-only rn/android/src/main/jniLibs/x86_64/libraftdb.so | grep ' rft_open$'
      - name: assemble example through CMake and Nitro autolinking
        working-directory: rn/example/android
        run: ./gradlew assembleDebug --no-daemon

  rn-ios-native:
    name: binding / rn ios simulator
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: oven-sh/setup-bun@v2
      - name: install JavaScript dependencies
        working-directory: rn
        run: bun install --frozen-lockfile
      - name: rebuild and package Rust simulator library
        working-directory: core
        run: |
          cargo build --release --target aarch64-apple-ios-sim --features ffi
          cargo build --release --target x86_64-apple-ios --features ffi
          lipo -create target/aarch64-apple-ios-sim/release/libraftdb.a target/x86_64-apple-ios/release/libraftdb.a -output target/libraftdb-sim.a
          rm -rf ../rn/ios/RaftDB.xcframework
          xcodebuild -create-xcframework -library target/libraftdb-sim.a -output ../rn/ios/RaftDB.xcframework
      - name: verify exported C ABI
        run: nm -gU rn/ios/RaftDB.xcframework/ios-arm64_x86_64-simulator/libraftdb-sim.a | grep ' _rft_open$'
      - name: install pods
        working-directory: rn/example/ios
        run: pod install
      - name: build example workspace
        working-directory: rn/example/ios
        run: xcodebuild -workspace RaftExample.xcworkspace -scheme RaftExample -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
